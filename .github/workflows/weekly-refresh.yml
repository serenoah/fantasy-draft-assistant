name: Weekly data refresh

# Rebuilds data/players.json and data/dstk.json from ESPN + Sleeper public APIs
# after each NFL week, verifies them in headless Edge, and commits the result.
# The app fetches data/*.json from this repo on load, so it updates on its own.
on:
  schedule:
    - cron: '0 12 * * 3'   # Wednesdays 12:00 UTC (8am ET) - after MNF, once ESPN updates projections/injuries
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Refresh and verify data
        shell: powershell
        run: ./tools/refresh.ps1

      - name: Commit and push if changed
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json data/dstk.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "No data changes."; exit 0 }
          $week = (Invoke-RestMethod https://api.sleeper.app/v1/state/nfl).week
          git commit -m "Automated in-season data refresh (week $week)"
          git push
